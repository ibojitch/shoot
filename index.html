<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070d1c">
  <title>ORBIT / 2.5D Shooter</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
  <main id="game" aria-label="横スクロールシューティング">
    <header class="hud"><div class="brand">ORBIT <small>SECTOR 01</small></div><div><small>PLAYER HP</small><span id="hp">● ● ● ● ●</span></div><div><small>SCORE</small><span id="score">000000</span></div><button id="pause" aria-label="一時停止">Ⅱ</button></header>
    <div class="sector">DEEP SPACE / SURVIVAL FLIGHT</div>
    <section id="overlay" class="overlay"><div class="card"><p class="eyebrow">2.5D SPACE SHOOTER</p><h1 id="title">ORBIT</h1><p id="message">星の回廊を突破せよ。</p><button id="start">START FLIGHT</button><p class="help">WASD / 矢印で移動 · SPACEで射撃<br>タッチ：左スティックで移動 · 右ボタンで射撃<br>横画面推奨 · P / ESCで一時停止</p></div></section>
    <div id="touch-controls"><div id="stick" aria-label="移動スティック"><div id="knob"></div></div><button id="fire" aria-label="射撃">FIRE</button></div>
    <footer>MOVE <b>WASD / ↑↓←→</b><span>FIRE <b>SPACE</b></span></footer>
  </main>
  <script type="module">
    import('./game.js').catch(error => {
      console.error(error);
      document.querySelector('#title').textContent = '起動できませんでした';
      document.querySelector('#message').textContent = '通信状態とWebGL対応を確認し、ローカルHTTPサーバーから開いてください。';
      document.querySelector('#start').textContent = '再読み込み';
      document.querySelector('#start').onclick = () => location.reload();
    });
  </script>
</body>
</html>
